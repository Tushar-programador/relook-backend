name: Keep GitHub Streak Alive

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Tushar-programador"
          git config user.email "155283301+Tushar-programador@users.noreply.github.com"

      - name: Sync with Main
        run: |
          git pull --rebase origin main

      - name: Generate Random Commit Count
        id: random
        run: |
          COUNT=$(( RANDOM % 15 + 1 ))
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Today's commit count: $COUNT"

      - name: Make Random Commits
        run: |
          COUNT=${{ steps.random.outputs.count }}

          for i in $(seq 1 "$COUNT"); do
            echo "Update $i on $(date -u)" >> streak.txt

            git add streak.txt
            git commit -m "Daily streak update $(date -u +'%Y-%m-%d %H:%M:%S')"

            git push origin main

            if [ "$i" -lt "$COUNT" ]; then
              sleep $(( RANDOM % 60 + 10 ))
            fi
          done
